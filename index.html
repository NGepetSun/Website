<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiWatch - YouTube Live Multi-Stream Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M10 9.5L14 12L10 14.5V9.5Z" fill="currentColor"/>
                    <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">MultiWatch</span>
            </div>
        </div>
        <div class="header-center">
            <div class="layout-switcher">
                <button class="layout-btn active" data-layout="grid-2x2" title="2x2 Grid">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="1" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="1" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="layout-btn" data-layout="grid-1x2" title="1x2 Side by Side">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="18" rx="1" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="18" rx="1" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="layout-btn" data-layout="grid-1x3" title="1x3 Triple">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="6" height="18" rx="1" stroke="currentColor" stroke-width="2"/><rect x="9" y="3" width="6" height="18" rx="1" stroke="currentColor" stroke-width="2"/><rect x="16" y="3" width="6" height="18" rx="1" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="layout-btn" data-layout="grid-focus" title="Focus Mode">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="13" height="13" rx="1" stroke="currentColor" stroke-width="2"/><rect x="17" y="2" width="5" height="6" rx="1" stroke="currentColor" stroke-width="2"/><rect x="17" y="10" width="5" height="6" rx="1" stroke="currentColor" stroke-width="2"/><rect x="2" y="17" width="5" height="5" rx="1" stroke="currentColor" stroke-width="2"/><rect x="9" y="17" width="5" height="5" rx="1" stroke="currentColor" stroke-width="2"/><rect x="17" y="18" width="5" height="4" rx="1" stroke="currentColor" stroke-width="2"/></svg>
                </button>
                <button class="layout-btn" data-layout="grid-3x3" title="3x3 Grid">
                    <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9.25" y="2" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="16.5" y="2" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="9.25" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9.25" y="9.25" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="16.5" y="9.25" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="16.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="9.25" y="16.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="16.5" y="16.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
                </button>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-icon" id="toggleSidebar" title="Toggle Channel List">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="btn-icon" id="toggleTheme" title="Toggle Theme">
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Channels</h2>
                <span class="channel-count" id="channelCount">0</span>
            </div>

            <!-- Add Custom Stream -->
            <div class="add-stream">
                <h3>Add Stream</h3>
                <div class="input-group">
                    <input type="text" id="customUrl" placeholder="YouTube URL or Video ID" />
                    <button class="btn-primary" id="addCustomStream">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                </div>
            </div>

            <!-- Channel List -->
            <div class="channel-list" id="channelList">
                <!-- Channels will be populated by JS -->
            </div>

            <div class="sidebar-footer">
                <button class="btn-secondary" id="removeAll">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M3 6H5H21M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Remove All
                </button>
            </div>
        </aside>

        <!-- Video Grid -->
        <div class="grid-container" id="gridContainer">
            <div class="video-grid grid-2x2" id="videoGrid">
                <!-- Video players will be populated by JS -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 24 24" fill="none" class="empty-icon">
                    <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M10 9.5L14 12L10 14.5V9.5Z" fill="currentColor"/>
                    <line x1="8" y1="21" x2="16" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="12" y1="17" x2="12" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <h2>No Active Streams</h2>
                <p>Add channels from the sidebar or use the preconfigured channels below</p>
                <button class="btn-primary btn-large" id="loadDefaults">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    Load Default Channels
                </button>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Rotate to Landscape Prompt (shown on mobile portrait) -->
    <div class="rotate-prompt" id="rotatePrompt">
        <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M20 14L22 12L20 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 12H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h3>Rotate for Better Viewing</h3>
        <p>Turn your device sideways to watch videos in full landscape mode</p>
        <button class="dismiss-btn" id="dismissRotate">Continue in Portrait</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
